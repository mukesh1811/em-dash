<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>em&mdash;dash</title>
    <style>
        :root {
            color-scheme: light;
            --background: #fff;
            --text: #171717;
            --muted: #686868;
            --control: #d8d8d8;
            --hover: #f2f2f2;
            --active: #e8e8e8;
            --rule: #777;
            --flash: rgb(119 119 119 / 14%);
            --flash-edge: rgb(119 119 119 / 62%);
        }

        :root.dark-mode {
            color-scheme: dark;
            --background: #171717;
            --text: #eee;
            --muted: #aaa;
            --control: #505050;
            --hover: #2a2a2a;
            --active: #303030;
            --rule: #8a8a8a;
            --flash: rgb(238 238 238 / 12%);
            --flash-edge: rgb(238 238 238 / 58%);
        }

        html {
            scrollbar-gutter: stable;
            scroll-padding-bottom: 60px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
        }

        a {
            color: inherit;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            min-height: 88px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--background);
            transition: min-height 180ms ease;
        }

        .header h1,
        .byline {
            margin: 0;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .header h1,
        .editor {
            font-family: monospace;
        }

        .byline {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        button {
            padding: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }

        .theme-toggle {
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border: 1px solid var(--control);
            border-radius: 50%;
        }

        .theme-toggle::before {
            content: "\1f4a1";
            opacity: 0.45;
            filter: grayscale(1);
            transition: opacity 120ms ease, filter 120ms ease;
        }

        .dark-mode .theme-toggle::before {
            opacity: 1;
            filter: none;
        }

        .theme-toggle:hover,
        .nav-toggle:hover {
            background: var(--hover);
        }

        .nav-toggle {
            display: grid;
            width: 40px;
            height: 28px;
            place-items: center;
            border: 0;
            border-bottom: 2px solid var(--rule);
            opacity: 0.9;
            transition: background 120ms ease, opacity 120ms ease;
        }

        .nav-toggle:hover {
            opacity: 1;
        }

        .nav-toggle::before {
            content: "\2303";
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 0.7;
            animation: chevron 0.8s ease-in-out infinite;
        }

        .nav-collapsed .header {
            min-height: 32px;
        }

        .nav-collapsed .header h1,
        .nav-collapsed .byline {
            position: absolute;
            visibility: hidden;
            opacity: 0;
            transform: translateY(-8px);
        }

        .nav-collapsed .nav-toggle {
            border-top: 2px solid var(--rule);
            border-bottom: 0;
        }

        .nav-collapsed .nav-toggle::before {
            content: "\2304";
        }

        .header.flash {
            animation: flash 420ms ease-out;
        }

        @keyframes chevron {
            50% {
                opacity: 1;
                transform: translateY(3px);
            }
        }

        @keyframes flash {
            28% {
                background: var(--flash);
                box-shadow: inset 0 0 0 2px var(--flash-edge);
            }
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(180px, 220px) minmax(0, 1fr);
            width: min(1100px, 100%);
            margin: auto;
            padding: 0 20px 40px;
        }

        .sidebar {
            position: sticky;
            top: 88px;
            align-self: start;
            min-height: calc(100vh - 88px);
            padding: 18px 18px 0 0;
            border-right: 1px solid var(--control);
            color: var(--muted);
            transition: top 180ms ease, min-height 180ms ease;
        }

        .nav-collapsed .sidebar {
            top: 32px;
            min-height: calc(100vh - 32px);
        }

        .sidebar-title {
            margin: 0 0 14px;
            color: var(--text);
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tab-list {
            display: grid;
            gap: 6px;
        }

        .tab-group {
            display: grid;
            gap: 4px;
        }

        .tab-button {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            text-align: left;
        }

        .tab-button:hover {
            background: var(--hover);
            color: var(--text);
        }

        .tab-button.active {
            border-color: var(--control);
            background: var(--active);
            color: var(--text);
        }

        .subtab-button {
            margin-left: 18px;
            font-size: 0.92rem;
        }

        main {
            min-width: 0;
            padding-left: 20px;
        }

        .editor {
            min-height: 60vh;
            padding: 18px 18px 60px;
            outline: none;
            font-size: 18px;
            line-height: 1.25;
        }

        @media (max-width: 640px) {
            .workspace {
                display: block;
                padding: 0 14px 32px;
            }

            .sidebar {
                position: static;
                min-height: 0;
                padding: 12px 0;
                border-right: 0;
                border-bottom: 1px solid var(--control);
            }

            .tab-list {
                grid-auto-flow: column;
                grid-auto-columns: minmax(130px, 1fr);
                overflow-x: auto;
                padding-bottom: 6px;
            }

            main {
                padding-left: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .header,
            .header *,
            .header *::before {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <h1>em&mdash;dash</h1>
        <p class="byline">
            <button
                class="theme-toggle"
                id="theme-toggle"
                type="button"
                aria-label="Switch to dark mode"
                aria-pressed="false"
                title="Switch to dark mode"></button>
            <span>built by <a href="../index.html">Mukesh</a></span>
        </p>
        <button
            class="nav-toggle"
            id="nav-toggle"
            type="button"
            aria-controls="header"
            aria-expanded="true"
            aria-label="Collapse top bar"
            title="Collapse top bar"></button>
    </header>

    <div class="workspace">
        <aside class="sidebar" aria-label="Documents">
            <h2 class="sidebar-title">Documents</h2>
            <nav class="tab-list" id="tab-list" aria-label="Document tabs"></nav>
        </aside>

        <main>
            <div
                class="editor"
                id="editor"
                contenteditable="true"
                role="textbox"
                aria-multiline="true"></div>
        </main>
    </div>

    <script>
        const root = document.documentElement;
        const header = document.getElementById("header");
        const editor = document.getElementById("editor");
        const tabList = document.getElementById("tab-list");
        const navToggle = document.getElementById("nav-toggle");
        const themeToggle = document.getElementById("theme-toggle");
        const caretAnchor = "\u200B";
        const graphemes = new Intl.Segmenter(undefined, { granularity: "grapheme" });
        const inlinePattern = /(?<!\*)(\*{1,3})([^*]+)\1(?!\*)|(?<!_)_([^_]+)_(?!_)/g;
        const tabs = [
            { id: "write", label: "Write", subtab: { id: "draft", label: "Draft" } },
            { id: "notes", label: "Notes", subtab: { id: "ideas", label: "Ideas" } },
            { id: "archive", label: "Archive", subtab: { id: "saved", label: "Saved" } }
        ];
        let activeTab = tabs.some((tab) => tab.id === load("active-tab")) ? load("active-tab") : tabs[0].id;
        let activeSubtab = load("active-subtab");
        if (!tabs.find((tab) => tab.id === activeTab)?.subtab || tabs.find((tab) => tab.id === activeTab).subtab.id !== activeSubtab) {
            activeSubtab = null;
        }

        function load(name) {
            try {
                return localStorage.getItem(`em-dash-${name}`);
            } catch {
                return null;
            }
        }

        function save(name, value) {
            try {
                localStorage.setItem(`em-dash-${name}`, value);
            } catch {}
        }

        function currentDocumentKey() {
            return ["draft", activeTab, activeSubtab].filter(Boolean).join("-");
        }

        function saveDraft() {
            save(currentDocumentKey(), editor.innerHTML.replaceAll(caretAnchor, ""));
        }

        function loadDraft() {
            const legacyDraft = activeTab === tabs[0].id && !activeSubtab ? load("draft") : null;
            editor.innerHTML = load(currentDocumentKey()) ?? legacyDraft ?? "";
            const activeLabel = tabs.find((tab) => tab.id === activeTab)?.label;
            const subtabLabel = tabs.find((tab) => tab.id === activeTab)?.subtab?.id === activeSubtab
                ? tabs.find((tab) => tab.id === activeTab).subtab.label
                : null;
            editor.setAttribute("aria-label", `${activeLabel}${subtabLabel ? `, ${subtabLabel}` : ""} document`);
        }

        function setActiveDocument(tabId, subtabId = null, persist = false) {
            saveDraft();
            activeTab = tabId;
            activeSubtab = subtabId;
            renderTabs();
            loadDraft();
            if (persist) {
                save("active-tab", activeTab);
                save("active-subtab", activeSubtab ?? "");
            }
            editor.focus({ preventScroll: true });
        }

        function renderTabs() {
            tabList.replaceChildren(...tabs.map((tab) => {
                const group = document.createElement("div");
                group.className = "tab-group";

                const button = document.createElement("button");
                button.className = `tab-button${activeTab === tab.id && !activeSubtab ? " active" : ""}`;
                button.type = "button";
                button.textContent = tab.label;
                button.setAttribute("aria-pressed", String(activeTab === tab.id && !activeSubtab));
                button.addEventListener("click", () => setActiveDocument(tab.id, null, true));
                group.append(button);

                if (tab.subtab && activeTab === tab.id) {
                    const subtab = document.createElement("button");
                    subtab.className = `tab-button subtab-button${activeSubtab === tab.subtab.id ? " active" : ""}`;
                    subtab.type = "button";
                    subtab.textContent = tab.subtab.label;
                    subtab.setAttribute("aria-pressed", String(activeSubtab === tab.subtab.id));
                    subtab.addEventListener("click", () => setActiveDocument(tab.id, tab.subtab.id, true));
                    group.append(subtab);
                }

                return group;
            }));
        }

        function setDarkMode(dark, persist = false) {
            const action = dark ? "Switch to light mode" : "Switch to dark mode";
            root.classList.toggle("dark-mode", dark);
            themeToggle.setAttribute("aria-pressed", String(dark));
            themeToggle.setAttribute("aria-label", action);
            themeToggle.title = action;

            if (persist) {
                save("dark-mode", dark);
            }
        }

        function setNavCollapsed(collapsed, persist = false) {
            const action = collapsed ? "Expand top bar" : "Collapse top bar";
            root.classList.toggle("nav-collapsed", collapsed);
            navToggle.setAttribute("aria-expanded", String(!collapsed));
            navToggle.setAttribute("aria-label", action);
            navToggle.title = action;

            if (persist) {
                header.classList.remove("flash");
                requestAnimationFrame(() => header.classList.add("flash"));
                save("nav-collapsed", collapsed);
            }
        }

        header.addEventListener("mousedown", (event) => {
            if (event.target.closest("button")) {
                event.preventDefault();
            }
        });

        themeToggle.addEventListener("click", () => {
            setDarkMode(!root.classList.contains("dark-mode"), true);
            editor.focus({ preventScroll: true });
        });

        navToggle.addEventListener("click", () => {
            setNavCollapsed(!root.classList.contains("nav-collapsed"), true);
            editor.focus({ preventScroll: true });
        });

        editor.addEventListener("beforeinput", (event) => {
            if (event.inputType !== "deleteContentBackward") {
                return;
            }

            const selection = getSelection();
            const node = selection.anchorNode;
            const offset = selection.anchorOffset;

            if (selection.isCollapsed && node?.nodeType === Node.TEXT_NODE && node.data[offset - 1] === caretAnchor) {
                let previous = offset === 1 ? node.previousSibling : null;

                while (previous?.nodeType === Node.TEXT_NODE && !previous.data) {
                    const empty = previous;
                    previous = previous.previousSibling;
                    empty.remove();
                }

                if (previous?.nodeType === Node.ELEMENT_NODE && previous.matches("strong, em")) {
                    event.preventDefault();
                    const walker = document.createTreeWalker(previous, NodeFilter.SHOW_TEXT);
                    let lastText;

                    while (walker.nextNode()) {
                        lastText = walker.currentNode;
                    }

                    if (lastText?.data) {
                        const last = [...graphemes.segment(lastText.data)].at(-1);
                        lastText.deleteData(last.index, lastText.length - last.index);
                    }
                    previous.after(node);
                    if (!previous.textContent) {
                        previous.remove();
                    }

                    selection.collapse(node, node.length);
                    saveDraft();
                    return;
                }

                node.deleteData(offset - 1, 1);
                selection.collapse(node, offset - 1);
            }
        });

        editor.addEventListener("input", (event) => {
            if (event.data !== " " || !formatBlock()) {
                formatInline();
            }
            saveDraft();
        });

        function formatBlock() {
            const selection = getSelection();
            const anchor = selection.anchorNode;
            const element = anchor?.nodeType === Node.ELEMENT_NODE ? anchor : anchor?.parentElement;
            let block = element?.closest("div, p, h1, h2, h3, blockquote, li");

            if (!selection.rangeCount || !block) {
                return false;
            }

            const text = block.textContent.replaceAll(caretAnchor, "");
            const match = /^(#{1,3}|>|-|\d+\.)\s/.exec(text);
            if (!match) {
                return false;
            }

            if (block === editor) {
                block = document.createElement("div");
                block.append(...editor.childNodes);
                editor.append(block);
            }

            const mark = match[1];
            const content = text.slice(match[0].length);

            if (mark.startsWith("#")) {
                replaceBlock(block, `h${mark.length}`, content);
            } else if (mark === ">") {
                replaceBlock(block, "blockquote", content);
            } else {
                replaceWithList(block, mark === "-" ? "ul" : "ol", content);
            }
            return true;
        }

        function replaceBlock(block, tag, text) {
            const replacement = document.createElement(tag);
            replacement.append(text || document.createElement("br"));
            block.replaceWith(replacement);
            placeCaretAtEnd(replacement);
        }

        function replaceWithList(block, tag, text) {
            if (block.matches("li") && block.parentElement?.matches(tag)) {
                block.replaceChildren(text || document.createElement("br"));
                placeCaretAtEnd(block);
                return;
            }

            const list = document.createElement(tag);
            const item = document.createElement("li");
            item.append(text || document.createElement("br"));
            list.append(item);
            block.replaceWith(list);
            placeCaretAtEnd(item);
        }

        function formatInline() {
            const caret = markCaret();
            const cleanup = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
            while (cleanup.nextNode()) {
                cleanup.currentNode.data = cleanup.currentNode.data.replaceAll(caretAnchor, "");
            }
            editor.normalize();

            const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
            const nodes = [];

            while (walker.nextNode()) {
                const node = walker.currentNode;
                if (node.data.trim() && !node.parentElement?.closest("strong, em, [data-caret]")) {
                    nodes.push(node);
                }
            }
            nodes.forEach(formatTextNode);
            restoreCaret(caret);
        }

        function formatTextNode(node) {
            const fragment = document.createDocumentFragment();
            let end = 0;
            let changed = false;

            for (const match of node.data.matchAll(inlinePattern)) {
                const mark = match[1] || "_";
                const text = match[2] ?? match[3];
                let element = document.createElement(mark.length === 2 ? "strong" : "em");
                element.textContent = text;

                if (mark.length === 3) {
                    const strong = document.createElement("strong");
                    strong.append(element);
                    element = strong;
                }

                fragment.append(node.data.slice(end, match.index), element);
                end = match.index + match[0].length;
                changed = true;
            }

            if (changed) {
                fragment.append(node.data.slice(end));
                node.replaceWith(fragment);
            }
        }

        function markCaret() {
            const selection = getSelection();
            if (!selection.rangeCount) {
                return null;
            }

            const marker = document.createElement("span");
            marker.dataset.caret = "";
            selection.getRangeAt(0).insertNode(marker);
            return marker;
        }

        function restoreCaret(marker) {
            if (!marker?.isConnected) {
                return;
            }

            const anchor = document.createTextNode(caretAnchor);
            marker.replaceWith(anchor);
            const range = document.createRange();
            range.setStart(anchor, 1);
            range.collapse(true);

            const selection = getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function placeCaretAtEnd(element) {
            const range = document.createRange();
            range.selectNodeContents(element);
            range.collapse(false);

            const selection = getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        setDarkMode(load("dark-mode") === "true");
        setNavCollapsed(load("nav-collapsed") === "true");
        renderTabs();
        loadDraft();
        editor.focus();
    </script>
</body>
</html>
